[build-system]
requires=["setuptools>=61.0"]
build-backend="setuptools.build_meta"
[project]
name="authscan"
version="0.1.0"
description="Auth scanner"
readme="README.md"
requires-python=">=3.10"
dependencies=["click>=8.1.0","requests>=2.31.0","rich>=13.0.0"]
[project.scripts]
authscan="authscan.cli:main"
[tool.setuptools.packages.find]
where=["src"]
